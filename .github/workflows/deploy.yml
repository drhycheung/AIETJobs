name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 07:00 Hong Kong time (UTC+8) = 23:00 UTC the previous day
    - cron: '0 23 * * *'

# Allow the GITHUB_TOKEN to commit the refreshed data and deploy to Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Run only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the daily commit can be pushed from the runner
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF reader
        # Required for the compliance check that reads the official job-description
        # PDF; without it that check silently degrades to no check at all.
        run: python -m pip install --quiet pypdf

      - name: Refresh job data
        # If crawling fails, still deploy the last committed site
        continue-on-error: true
        env:
          # Search API used for discovery; the key is a repository secret and is
          # never written into the repository.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scraper/run.py

      - name: Commit refreshed data
        # Pushes made with the repository's GITHUB_TOKEN do not start a new
        # workflow run, so this cannot loop. The deployment below still runs in
        # this same run, using the files just generated.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site data REPORT.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily job data update $(date -u +%F)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The student page and its data live together in site/; deploy that directory directly
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
